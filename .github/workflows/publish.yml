# Publish `sukko` to PyPI on a GitHub Release, via PyPI Trusted Publishing (OIDC).
#
# No API token is stored: the `id-token: write` permission lets PyPI verify this
# workflow's OIDC identity. Before the first run, configure a PyPI "pending publisher"
# for project `sukko` with: owner `sukko-dev`, repository `sdk-py`, workflow
# `publish.yml`, environment `pypi`.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC → PyPI Trusted Publishing (no stored token)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
